<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Messenger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>Realtime Messenger</h1>

        <section id="registrationSection" class="panel">
          <h2>Реєстрація</h2>
          <form id="registrationForm">
            <label>Ім'я<input name="name" minlength="2" required /></label>
            <label>
              Телефон
              <input name="phone" type="tel" pattern="^\+?[0-9]{10,15}$" placeholder="+380XXXXXXXXX" required />
            </label>
            <button type="submit">Увійти</button>
          </form>
        </section>

        <section id="profileSection" class="panel hidden">
          <h2>Профіль</h2>
          <div id="myProfile"></div>
          <h3>Онлайн</h3>
          <div id="onlineUsers" class="online-users"></div>
        </section>

        <nav id="tabs" class="hidden">
          <button class="tab-btn active" data-tab="chat">Чат</button>
          <button class="tab-btn" data-tab="urgent">Срочні</button>
        </nav>
      </aside>

      <main>
        <section id="chatSection" class="panel hidden">
          <div class="chat-header">
            <h2>Загальний чат</h2>
            <button id="callBtn">📞 Дзвінок</button>
          </div>
          <div id="messages" class="messages"></div>
          <form id="messageForm" class="row-form">
            <input name="message" placeholder="Напишіть повідомлення..." required />
            <button type="submit">Надіслати</button>
          </form>
        </section>

        <section id="urgentSection" class="panel hidden">
          <h2>Срочні повідомлення</h2>
          <form id="urgentForm" class="urgent-form">
            <label>
              Тип
              <select name="mode" id="urgentMode">
                <option value="global">Загальне (всім)</option>
                <option value="personal">Персональне (1 користувачу)</option>
              </select>
            </label>

            <label id="targetPhoneWrap" class="hidden">
              Телефон отримувача
              <input name="targetPhone" placeholder="+380XXXXXXXXX" />
            </label>

            <label>
              Текст
              <textarea name="urgentText" rows="4" maxlength="280" required></textarea>
            </label>

            <div class="examples">
              Приклади:
              <button type="button" class="example-btn" data-example="У вас вода кипить">У вас вода кипить</button>
              <button type="button" class="example-btn" data-example="У вас їжа горить">У вас їжа горить</button>
            </div>

            <button type="submit">Надіслати срочне</button>
          </form>

          <div id="urgentHistory" class="urgent-history"></div>
        </section>
      </main>
    </div>

    <div id="urgentOverlay" class="urgent-overlay hidden" role="alert">
      <div class="urgent-content">
        <h2>⚠️ Срочне повідомлення</h2>
        <p id="urgentOverlayText"></p>
        <p id="urgentOverlayMeta" class="meta"></p>
        <button id="closeOverlay">Закрити</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
